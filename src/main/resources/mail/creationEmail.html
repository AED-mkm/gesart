<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="fr">
  <head>
    <title th:text="#{email.activation.title}">Création de compte</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.ico|}"/>
  </head>
  <body>
    <p th:text="#{email.activation.greeting(${user.nom})}">Dear</p>
    <p th:text="#{email.creation.text1}"></p>
    <p th:text="#{user.username(${user.login})}"></p>
    <p th:text="#{user.password(${user.info})}"></p>
    <p>
      <a th:with="url=(@{|${baseUrl}/password/activate?key=${user.activationKey}|})" th:href="${url}" th:text="${url}">Login link</a>
    </p>
    <p>
      <span th:text="#{email.activation.text2}">Cordialement, </span>
      <br/>
      <em th:text="#{email.signature}">Kossnaana plateform.</em>
    </p>
  </body>
</html>
